<body class="font-serif text-ink bg-butter">

  <!-- HEADER -->

    <div class="max-w-6xl mx-auto px-5 sm:px-7 py-4 flex items-center justify-between gap-4">
      <a href="#top" class="logo font-hand text-3xl md:text-4xl leading-none whitespace-nowrap">la raminga</a>

      <nav class="hidden md:flex items-center gap-7 text-base" aria-label="Primary">
        <a href="#about"    class="hover:underline underline-offset-[6px] decoration-2 decoration-current" data-i18n="nav.about"></a>
        <a href="#cuisine"  class="hover:underline underline-offset-[6px] decoration-2 decoration-current" data-i18n="nav.cuisine"></a>
        <a href="#garden"   class="hover:underline underline-offset-[6px] decoration-2 decoration-current" data-i18n="nav.garden"></a>
        <a href="#services" class="hover:underline underline-offset-[6px] decoration-2 decoration-current" data-i18n="nav.services"></a>
        <a href="#gallery"  class="hover:underline underline-offset-[6px] decoration-2 decoration-current" data-i18n="nav.gallery"></a>
        <a href="#contact"  class="hover:underline underline-offset-[6px] decoration-2 decoration-current" data-i18n="nav.contact"></a>

      <div class="flex items-center gap-2">
        <button data-locale-btn="it" class="locale-btn" aria-label="Italiano" aria-pressed="true">
          <svg width="24" height="16" viewBox="0 0 60 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

            <clipPath id="flag-uk-clip"><rect width="60" height="40"/></clipPath>
            <g clip-path="url(#flag-uk-clip)">
              <rect width="60" height="40" fill="#2a1f17"/>

        <button id="nav-toggle" class="md:hidden ml-1 p-2 -mr-2" aria-label="Menu" aria-controls="nav-menu" aria-expanded="false">
          <svg class="icon-burger" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">

        <a href="#contact"  data-i18n="nav.contact"></a>
      </div>

  <span id="top"></span>

  <main>

    <!-- HERO -->
    <section class="relative min-h-[100svh] flex items-center overflow-hidden">
      <div class="absolute inset-0">
        <picture>
          <source srcset="img/terrace-dining-table-mountain-view.webp" type="image/webp">
          <img src="img/terrace-dining-table-mountain-view.jpeg" alt="" width="1200" height="1600" class="w-full h-full object-cover" loading="eager" decoding="async" fetchpriority="high">
        </picture>
        <div class="absolute inset-0 hero-vignette"></div>
      </div>

      <div class="relative max-w-3xl mx-auto w-full px-5 sm:px-7 py-32 md:py-40 text-cream text-center hero-text">
        <h1 class="font-hand leading-[0.85] text-cream text-7xl sm:text-8xl md:text-[10rem]" data-i18n="hero.title"></h1>
        <p class="mt-6 text-base sm:text-lg md:text-xl uppercase tracking-[0.18em] text-cream font-medium" data-i18n="hero.kicker"></p>
        <p class="mt-6 mx-auto max-w-2xl text-lg md:text-xl text-cream leading-relaxed" data-i18n="hero.subtitle"></p>

        <div class="mt-12 flex flex-col sm:flex-row gap-3 sm:gap-4 justify-center">
          <a href="#" data-whatsapp target="_blank" rel="noopener"
            class="inline-flex items-center justify-center bg-brick hover:bg-terra text-white px-7 py-3 rounded-full font-medium text-base md:text-lg transition"
            data-i18n="hero.cta"></a>
          <a href="#about"
            class="inline-flex items-center justify-center bg-cream/10 hover:bg-cream/20 backdrop-blur text-cream border border-cream/40 px-7 py-3 rounded-full font-medium text-base md:text-lg transition"
            data-i18n="hero.secondary"></a>
        </div>
      </div>
    </section>

    <!-- ABOUT -->
    <section id="about" class="relative overflow-hidden py-20 md:py-28 px-5 sm:px-7 bg-washSky">
      <div class="relative z-10 max-w-6xl mx-auto grid md:grid-cols-5 gap-10 md:gap-16 items-center">
        <div class="md:col-span-3">
          <h2 class="font-hand text-5xl md:text-6xl text-skyDeep leading-none" data-i18n="about.title"></h2>
          <p class="mt-6 text-lg md:text-xl leading-relaxed" data-i18n="about.p1"></p>
          <p class="mt-4 text-lg md:text-xl leading-relaxed" data-i18n="about.p2"></p>
          <p class="mt-4 text-lg md:text-xl leading-relaxed" data-i18n="about.p3"></p>
        </div>
        <div class="md:col-span-2">
          <div class="relative aspect-[3/4] overflow-hidden rounded-2xl bg-cream">
            <picture>
              <source srcset="img/terrace-herb-garden-potted-plants.webp" type="image/webp">

            </picture>
          </div>
        </div>
      </div>
    </section>

    <!-- CUISINE -->
    <section id="cuisine" class="relative overflow-hidden py-20 md:py-28 px-5 sm:px-7 bg-washHoney">
      <div class="relative z-10 max-w-6xl mx-auto grid md:grid-cols-5 gap-10 md:gap-16 items-center">
        <div class="md:col-span-2 order-2 md:order-1">
          <div class="relative aspect-[3/4] overflow-hidden rounded-2xl bg-butter">

              <source srcset="img/tagliatelle-green-pesto-walnuts-parmesan.webp" type="image/webp">

        </div>
        <div class="md:col-span-3 order-1 md:order-2">
          <h2 class="font-hand text-5xl md:text-6xl text-honeyDeep leading-none" data-i18n="cuisine.title"></h2>
          <p class="mt-5 text-lg md:text-xl leading-relaxed" data-i18n="cuisine.lead"></p>
          <p class="mt-4 text-lg md:text-xl leading-relaxed" data-i18n="cuisine.body1"></p>
          <p class="mt-4 text-lg md:text-xl leading-relaxed" data-i18n="cuisine.body2"></p>
          <p class="mt-4 text-lg md:text-xl leading-relaxed" data-i18n="cuisine.body3"></p>
        </div>
      </div>
    </section>

    <!-- GARDEN -->
    <section id="garden" class="relative overflow-hidden py-20 md:py-28 px-5 sm:px-7 bg-washSage">
      <div class="relative z-10 max-w-6xl mx-auto grid md:grid-cols-5 gap-10 md:gap-16 items-center">
        <div class="md:col-span-3">
          <h2 class="font-hand text-5xl md:text-6xl text-sageDeep leading-none" data-i18n="garden.title"></h2>
          <p class="mt-6 text-lg md:text-xl leading-relaxed" data-i18n="garden.p1"></p>
          <p class="mt-4 text-lg md:text-xl leading-relaxed" data-i18n="garden.p2"></p>
        </div>
        <div class="md:col-span-2">
          <div class="relative aspect-[3/4] overflow-hidden rounded-2xl bg-cream">
            <picture>
              <source srcset="img/peas-climbing-beside-onion-bed.webp" type="image/webp">
              <img src="img/peas-climbing-beside-onion-bed.jpeg" alt="peas climbing beside onion bed" width="960" height="1280" loading="lazy" decoding="async" class="w-full h-full object-cover">
            </picture>
          </div>
        </div>
      </div>
    </section>

    <!-- SERVICES -->
    <section id="services" class="relative overflow-hidden py-20 md:py-28 px-5 sm:px-7 bg-washRose">
      <div class="relative z-10 max-w-6xl mx-auto">
        <div class="md:text-center">
          <h2 class="font-hand text-5xl md:text-6xl text-roseDeep leading-none" data-i18n="services.title"></h2>
          <p class="mt-4 text-lg md:text-xl leading-relaxed" data-i18n="services.subtitle"></p>
        </div>
        <div id="services-list" class="mt-12 grid md:grid-cols-3 gap-6 md:gap-7">
          <!-- @services -->
        </div>
      </div>
    </section>

    <!-- GALLERY -->
    <section id="gallery" class="relative overflow-hidden py-20 md:py-28 px-5 sm:px-7 bg-washBeige">
      <div class="relative z-10 max-w-7xl mx-auto">
        <div class="md:text-center">
          <h2 class="font-hand text-5xl md:text-6xl text-beigeDeep leading-none" data-i18n="gallery.title"></h2>
          <p class="mt-3 text-lg md:text-xl leading-relaxed" data-i18n="gallery.subtitle"></p>
        </div>
        <div class="gallery mt-10">
          <!-- @gallery -->
        </div>
      </div>
    </section>

      <div class="max-w-2xl mx-auto text-center">
        <h2 class="font-hand text-6xl md:text-7xl leading-none" data-i18n="contact.title"></h2>
        <p class="mt-6 text-lg md:text-xl leading-relaxed" data-i18n="contact.lead"></p>

        <a href="#" data-whatsapp target="_blank" rel="noopener"
          class="mt-8 inline-flex items-center justify-center gap-3 bg-brick hover:bg-terra px-8 py-4 rounded-full text-lg font-medium transition shadow-xl">

        </a>

        <p class="mt-3 text-sm text-cream/70" data-i18n="contact.leadNote"></p>

        <address class="mt-8 text-lg md:text-xl not-italic">
          <span data-i18n="contact.emailIntro"></span>
          <a href="mailto:vale.sfra@hotmail.it" class="underline underline-offset-4 hover:opacity-80">vale.sfra@hotmail.it</a>
        </address>
      </div>
    </section>

  </main>

  <!-- FOOTER -->
  <footer class="py-8 px-5 sm:px-7 bg-ink text-cream/70 border-t border-cream/10">
    <div class="max-w-6xl mx-auto flex flex-col md:flex-row gap-3 md:gap-6 items-center justify-between text-sm text-center md:text-left">
      <span data-i18n="footer.tagline"></span>
      <a href="https://laraminga-struttura.it" target="_blank" rel="noopener" class="hover:text-cream underline underline-offset-4 decoration-cream/20" data-i18n="footer.structureLink"></a>
